name: 检查Issue必要信息
on:
  issues:
    types: [opened]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 自动评论提醒补充信息（完美保留格式）
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "📌 温馨提醒：请确认您的Issue包含以下信息（不是BUG项议题忽略此回复）：\n✅ 问题复现步骤\n✅ 可参考的复现项目文件[.vue|.jsx|.tsx|.js|.ts]\n✅ 运行环境（插件版本/浏览器类型/设备类型）"
            })
