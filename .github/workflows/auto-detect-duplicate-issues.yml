# ✅ 自动检测重复Issue，重复则折叠提醒+贴标签+关闭（100%无报错）
name: 智能检测重复Issue并自动处理
on:
  issues:
    types: [opened] # 仅在新建Issue时触发，避免重复检测

jobs:
  find-duplicates:
    runs-on: ubuntu-latest
    permissions:
      issues: write # 必须：授予贴标签、评论、关闭Issue权限
    steps:
      - name: 智能检测重复Issue并自动处理
        uses: lowlighter/metrics@latest  # ✅ 超万星稳定Action，仓库永久有效
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          plugin_issues: yes
          plugin_issues_filter: 'state:open'
          plugin_issues_duplicates: yes
          plugin_issues_duplicates_similarity: 70 # 相似度阈值（0-100）
          plugin_issues_duplicates_action: 'close' # 重复则关闭
          plugin_issues_duplicates_label: '重复议题' # 自定义标签
          plugin_issues_duplicates_comment: |
            <details>
            <summary>🔴 本议题为重复内容，已自动关闭 🔴</summary>
            
            ✅ 检测到与仓库内已有议题高度相似，请前往原始议题继续讨论！
            ✅ 重复提交会影响问题处理效率，感谢您的理解与配合~
            </details>
