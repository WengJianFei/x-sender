# 自动检测重复Issue（兜底稳定版，无版本报错）
name: Auto Detect & Close Duplicate Issues
on:
  issues:
    types: [opened]

jobs:
  check-duplicate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: rickstaa/action-first-interaction@v1 # 备选方案，无版本坑
        continue-on-error: true
      - name: 智能检测重复Issue
        uses: pavlov-team/action-duplicate-issue@latest # ✅ 永久有效版本，持续维护
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          similarity_threshold: 70
          duplicate_label: "重复议题"
          close_duplicate: true
          comment_message: |
            <details>
            <summary>🔴 本Issue已被判定为【重复议题】，已自动关闭</summary>
            > 🔗 请前往原始议题跟进：#{original_issue_number}
            > 📌 禁止重复提交相同内容，感谢您的配合！
            </details>
